<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLORIPA MINIS - Sistema de Pontos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen">

    <nav class="bg-gray-800 border-b border-gray-700 p-4">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-green-400 flex items-center gap-2 tracking-wide">
                <i class="fa-solid fa-gem text-xl text-emerald-400"></i> FLORIPA MINIS
            </h1>
            <button class="bg-gray-700 hover:bg-gray-600 px-4 py-1.5 rounded-lg text-sm transition">
                Sair <i class="fa-solid fa-right-from-bracket ml-1"></i>
            </button>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto p-4 space-y-6">

        <section id="tela-cliente" class="bg-gray-800 rounded-2xl p-6 shadow-xl border border-gray-700">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <p class="text-gray-400 text-sm">Fidelidade | FLORIPA MINIS</p>
                    <h2 class="text-2xl font-bold text-white">João Silva</h2>
                </div>
                <span class="bg-gray-700 text-xs px-3 py-1 rounded-full text-gray-300 border border-gray-600">Área do Cliente</span>
            </div>

            <div class="bg-gradient-to-br from-emerald-600 to-green-500 rounded-xl p-6 text-center shadow-lg shadow-green-900/20 mb-8">
                <p class="text-green-100 uppercase tracking-wider text-xs font-semibold mb-1">Seu Saldo Atual</p>
                <h3 class="text-4xl font-black text-white flex items-center justify-center gap-2">
                    <i class="fa-solid fa-star text-yellow-300 animate-pulse"></i> 450 PONTOS
                </h3>
            </div>

            <h4 class="text-lg font-bold text-gray-200 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-gift text-green-400"></i> Prêmios Disponíveis
            </h4>
            
            <div class="grid gap-4 sm:grid-cols-2">
                <div class="bg-gray-750 p-4 rounded-xl border border-gray-700 flex flex-col justify-between bg-gray-700/50">
                    <div>
                        <h5 class="font-bold text-white text-lg">Cupom de R$ 20,00</h5>
                        <p class="text-green-400 font-medium text-sm mt-1">🪙 200 pontos</p>
                    </div>
                    <button class="w-full mt-4 bg-green-500 hover:bg-green-600 text-gray-900 font-bold py-2 px-4 rounded-lg transition text-sm">
                        Resgatar Prêmio
                    </button>
                </div>

                <div class="bg-gray-750 p-4 rounded-xl border border-gray-700 flex flex-col justify-between bg-gray-700/50">
                    <div>
                        <h5 class="font-bold text-white text-lg">Miniatura Exclusiva</h5>
                        <p class="text-green-400 font-medium text-sm mt-1">🪙 400 pontos</p>
                    </div>
                    <button class="w-full mt-4 bg-green-500 hover:bg-green-600 text-gray-900 font-bold py-2 px-4 rounded-lg transition text-sm">
                        Resgatar Prêmio
                    </button>
                </div>
            </div>
        </section>

        <section id="tela-admin" class="bg-gray-800 rounded-2xl p-6 shadow-xl border border-gray-700 mt-10">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-lock text-yellow-500"></i> Painel Administrativo | FLORIPA MINIS
                </h2>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Buscar Cliente por WhatsApp</label>
                    <div class="flex gap-2">
                        <input type="text" placeholder="Ex: 5548999999999" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-green-500 text-sm">
                        <button class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg font-medium text-sm transition">Buscar</button>
                    </div>
                </div>

                <div class="bg-gray-900/50 border border-gray-700 rounded-xl p-4 space-y-4">
                    <div class="flex justify-between items-center border-b border-gray-700 pb-3">
                        <div>
                            <p class="text-sm font-bold text-white">João Silva</p>
                            <p class="text-xs text-gray-400">WhatsApp: 5548999999999</p>
                        </div>
                        <p class="text-sm text-green-400 font-bold">Saldo: 450 pts</p>
                    </div>

                    <div class="flex flex-col sm:flex-row items-end gap-3">
                        <div class="w-full sm:w-1/3">
                            <label class="block text-xs text-gray-400 mb-1.5">Gerenciar Pontos</label>
                            <input type="number" value="100" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-1.5 text-center text-white focus:outline-none focus:border-green-500 font-bold">
                        </div>
                        <div class="w-full sm:w-2/3 flex gap-2">
                            <button class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-1.5 px-3 rounded-lg text-sm transition">
                                <i class="fa-solid fa-plus mr-1"></i> Adicionar
                            </button>
                            <button class="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-1.5 px-3 rounded-lg text-sm transition">
                                <i class="fa-solid fa-minus mr-1"></i> Remover
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

    </main>
</body>
</html>
